# Pull request checks: backend and frontend build, tests, and static analysis.
# Actions are pinned to commit SHAs (the tag in the comment), so a moved tag cannot change what runs.
# Each step runs the same command a teammate runs before pushing (see README.md, "Checks before pushing").

name: Pull request checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install the backend and its pinned dev tools
        run: pip install -e ".[dev]"
      - name: Ruff format (check only)
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: mypy type check
        run: mypy app tests
      - name: pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from the lock file
        run: npm ci
      - name: Prettier (check only)
        run: npm run format:check
      - name: oxlint (warnings fail)
        run: npm run lint
      - name: TypeScript type check
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build
