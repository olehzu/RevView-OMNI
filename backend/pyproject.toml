[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "revview-omni-backend"
version = "0.0.1"
description = "RevView/OMNI application API"
# 3.13 is the team's development version until the client's server version is known (OI-18).
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
